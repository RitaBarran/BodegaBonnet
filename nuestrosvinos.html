            </div>

    <section class="section-descuentos">

        <div class="descuentos">


            <div class="black">
                <h2>Selección de temporada</h2>
                <h3>Hasta 50% off</h3>

            </div>

            <div class="tiempo-restante">
                <p class="countdown-label">Termina en</p>
                <div class="countdown" id="countdown" aria-live="polite">
                    <div class="countdown-unit">
                        <span class="countdown-value" id="dias">20</span>
                        <span class="countdown-meta">Días</span>
                    </div>
                    <span class="countdown-sep" aria-hidden="true">:</span>
                    <div class="countdown-unit">
                        <span class="countdown-value" id="horas">00</span>
                        <span class="countdown-meta">Horas</span>
                    </div>
                    <span class="countdown-sep" aria-hidden="true">:</span>
                    <div class="countdown-unit">
                        <span class="countdown-value" id="minutos">00</span>
                        <span class="countdown-meta">Min</span>
                    </div>
                    <span class="countdown-sep" aria-hidden="true">:</span>
                    <div class="countdown-unit">
                        <span class="countdown-value" id="segundos">00</span>
                        <span class="countdown-meta">Seg</span>
                    </div>
                </div>
            </div>



        </div>
    </section>



    <section class="filtros">

        <div class="filtros2">



            <div class="tipodevino filtro-grupo">


                <h3 class="section-title">Tipo de vino</h3>

                <div id="selector1">
                    <label for="tinto">

                        <input type="checkbox" name="tipo de vino" value="tinto" id="tinto">
                        <span>Tinto</span>

                    </label>

                    <label for="rosado">

                        <input type="checkbox" name="tipo de vino" value="rosado" id="rosado">
                        <span>Rosado</span>

                    </label>

                    <label for="blanco">

                        <input type="checkbox" name="tipo de vino" value="blanco" id="blanco">
                        <span>Blanco</span>


                    </label>
                    <label for="espumoso">

                        <input type="checkbox" name="tipo de vino" value="espumante" id="espumoso">
                        <span>Espumoso</span>


                    </label>

                </div>

            </div>


            <div class="cosecha filtro-grupo">


                <h3 class="section-title">Cosecha</h3>

                <div id="selector2">
                    <label for="aneja">
                        <input type="checkbox" name="cosecha" value="añeja" id="aneja">
                        <span>Añeja</span>
                    </label>

                    <label for="nueva">
                        <input type="checkbox" name="cosecha" value="nueva" id="nueva">
                        <span>Nueva</span>
                    </label>
                </div>


            </div>

            <div class="ordenar filtro-grupo">

                <h3 class="section-title">Dulzor</h3>
                <select name="lista" required id="selector3">

                    <option value="todos">Todos</option>
                    <option value="semidulces">Vinos semidulces</option>
                    <option value="dulces">Vinos dulces</option>

                </select>


            </div>

            <div class="filtro-buscar filtro-grupo">

                <h3 class="section-title">Buscar</h3>
                <input type="text" name="buscar" placeholder="Nombre del vino..." id="buscar">

            </div>

        </div>



    </section>




    <div id="titulo">
        <h2>Nuestros vinos</h2>
    </div>

    <section class="contenedor" id="vinos">

    </section>
