    <div id="form">

        <div class="contacto-intro">
            <p class="section-eyebrow">Bodega Bonnet</p>
            <h3 id="textoh3">Contáctanos</h3>
            <p class="contacto-lead">Escribinos para visitas, consultas o pedidos. Te respondemos a la brevedad.</p>
        </div>

        <div class="contacto-layout">

            <form class="contacto-form">

                <div class="form-row">
                    <label for="nombre">Nombre *
                        <input type="text" id="nombre" name="nombre" required>
                    </label>

                    <label for="apellido">Apellido *
                        <input type="text" id="apellido" name="apellido" required>
                    </label>
                </div>

                <label for="email">Correo electrónico *
                    <input type="email" id="email" name="email" required placeholder="ej.: juan@gmail.com">
                </label>
                <p id="mensaje-de-error2"></p>

                <div class="form-row">
                    <label for="telefono">Móvil *
                        <input type="tel" id="telefono" name="telefono" required placeholder="ej.: 092810728">
                    </label>

                    <label for="ciudad">Ciudad *
                        <input type="text" id="ciudad" name="ciudad" required placeholder="ej.: Montevideo">
                    </label>
                </div>

                <label for="mensaje">Mensaje *
                    <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
                </label>

                <p class="form-note">Los campos con * son obligatorios</p>

                <p id="mensaje-de-error"></p>
                <p id="mensaje-ok"></p>

                <button type="submit" id="btn-enviar-form">Enviar</button>

            </form>

            <aside class="contacto-datos">
                <h4>Datos de contacto</h4>
                <p><span>Tel</span> +598 2500 0223</p>
                <p><span>Email</span> <a href="mailto:info@bonnet.com">info@bonnet.com</a></p>
                <p><span>Ubicación</span> <a href="https://maps.app.goo.gl/ci7RDgoHsSid2ieD6" target="_blank" rel="noopener">Ver en Google Maps</a></p>
            </aside>

        </div>
    </div>
